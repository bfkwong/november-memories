<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>November Memories</title>
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <main id="camera-view">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>

    <div id="message" class="message hidden">
      <p id="message-text"></p>
      <button id="start-btn" class="pill">Open camera</button>
    </div>

    <div class="controls">
      <span class="spacer"></span>
      <button id="shutter" aria-label="Take photo"></button>
      <button id="gallery-btn" class="thumb" aria-label="Open gallery">
        <img id="last-thumb" alt="">
        <span id="count"></span>
      </button>
    </div>
  </main>

  <section id="gallery-view" class="hidden">
    <header>
      <button id="back-btn" class="pill" aria-label="Camera">📷</button>
      <h1>Memories</h1>
      <button id="map-btn" class="pill" aria-label="Map">🗺️</button>
    </header>
    <div id="grid"></div>
    <p id="empty" class="hidden">No photos yet.</p>
  </section>

  <section id="map-view" class="hidden">
    <header>
      <button id="map-back" class="pill">← Gallery</button>
      <h1>Map</h1>
      <span id="map-info"></span>
    </header>
    <div id="map"></div>
  </section>

  <section id="detail-view" class="hidden">
    <header>
      <button id="detail-back" class="pill" aria-label="Gallery">🌆</button>
      <button id="detail-delete" class="pill danger" aria-label="Delete photo">🗑️</button>
    </header>
    <div id="detail-photo">
      <img id="detail-img" alt="">
      <div id="detail-meta"></div>
    </div>
    <div class="note-head">
      <label for="note">Note</label>
      <span id="saved" class="saved">&nbsp;</span>
    </div>
    <textarea id="note" rows="6" placeholder="Write a note about this photo…"></textarea>
  </section>

  <!-- Bump ?v= on everything below when you deploy (sed -i 's/?v=[0-9]*/?v=NN/g' index.html) -->
  <script type="importmap">
  { "imports": {
    "util": "./js/util.js?v=24",
    "nav": "./js/nav.js?v=24",
    "db": "./js/db.js?v=24",
    "geo": "./js/geo.js?v=24",
    "camera": "./js/camera.js?v=24",
    "leaflet-loader": "./js/leaflet-loader.js?v=24",
    "gallery": "./js/gallery.js?v=24",
    "detail": "./js/detail.js?v=24",
    "map": "./js/map.js?v=24"
  } }
  </script>
  <script type="module" src="./js/main.js?v=24"></script>
</body>
</html>
