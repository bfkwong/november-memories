<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>November Memories</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main id="camera-view">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>

    <div id="message" class="message hidden">
      <p id="message-text"></p>
      <button id="start-btn" class="pill">Open camera</button>
    </div>

    <div class="controls">
      <button id="gallery-btn" class="thumb" aria-label="Open gallery">
        <img id="last-thumb" alt="">
        <span id="count"></span>
      </button>
      <button id="shutter" aria-label="Take photo"></button>
      <span class="spacer"></span>
    </div>
  </main>

  <section id="gallery-view" class="hidden">
    <header>
      <button id="back-btn" class="pill">← Camera</button>
      <h1>Memories</h1>
      <button id="map-btn" class="pill">🗺 Map</button>
    </header>
    <div id="grid"></div>
    <p id="empty" class="hidden">No photos yet.</p>
  </section>

  <section id="map-view" class="hidden">
    <header>
      <button id="map-back" class="pill">← Gallery</button>
      <h1>Map</h1>
      <span id="map-info"></span>
    </header>
    <div id="map"></div>
  </section>

  <section id="detail-view" class="hidden">
    <header>
      <button id="detail-back" class="pill">← Gallery</button>
      <button id="detail-delete" class="pill danger">Delete</button>
    </header>
    <div id="detail-photo">
      <img id="detail-img" alt="">
      <button id="expand-btn" class="round" aria-label="Expand photo">⤢</button>
    </div>
    <div id="detail-meta"></div>
    <label for="note">Note</label>
    <textarea id="note" rows="6" placeholder="Write a note about this photo…"></textarea>
    <p id="saved" class="saved">&nbsp;</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
